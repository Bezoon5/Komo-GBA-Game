name: Build ROM

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach the ROM to a release when a version tag is pushed

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc python3 python3-numpy python3-pil \
                                  fonts-noto-cjk fonts-noto-cjk-extra fonts-dejavu-core

      - name: Build
        run: ./build.sh

      - name: Smoke test (sanitizer harness, scripted controls and a bot match)
        run: |
          ./out/host_test 4000 0 11 1 1
          ./out/host_test 12000 0 0 1 1

      - uses: actions/upload-artifact@v4
        with:
          name: komo-rom
          path: out/komo.gba

      - name: Attach the ROM to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/komo.gba
